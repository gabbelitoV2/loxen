name: Sync and build

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-and-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Sync with eerimoq/moblin
        if: github.event_name != 'push' && env.DEEPSEEK_API_KEY != ''
        run: |
          pip install anthropic
          git config user.name "moblin-android sync"
          git config user.email "moblin-android-sync@users.noreply.github.com"
          python tools/sync.py --commit --push
      - name: Build
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: moblin-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
